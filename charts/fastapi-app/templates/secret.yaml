apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fastapi-app.fullname" . }}-secrets
  labels:
    {{- include "fastapi-app.labels" . | nindent 4 }}
type: Opaque
data:
  # Using b64enc for values. In production, these should be managed via HashiCorp Vault or similar.
  SECRET_KEY: {{ .Values.secrets.SECRET_KEY | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | b64enc | quote }}
  FIRST_SUPERUSER_PASSWORD: {{ .Values.secrets.FIRST_SUPERUSER_PASSWORD | b64enc | quote }}
