name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, item-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d db mailcatcher
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: services/${{ matrix.service }}
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }} - ${{ matrix.service }}"
        working-directory: services/${{ matrix.service }}
      - run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-${{ matrix.service }}
          path: services/${{ matrix.service }}/htmlcov
          include-hidden-files: true
      - name: Coverage report
        run: uv run coverage report --fail-under=80
        working-directory: services/${{ matrix.service }}
